[project]
name = "kandinsky-controlnet-depth-pipeline"
version = "0.1.0"
description = "DIMER pipeline for Kandinsky 2.2 ControlNet-depth (kandinsky-community/kandinsky-2-2-controlnet-depth + kandinsky-2-2-prior, depth hints from Intel/dpt-large): depth-conditioned generation, held-out denoising-loss, CLIP and depth-fidelity evaluation, and bounded LoRA fine-tuning with a portable adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "torchaudio==2.11.0",
  "diffusers==0.40.0",
  "transformers==5.17.0",
  "peft==0.21.0",
  "torchao==0.18.0",
  "accelerate==1.15.0",
  "tokenizers==0.23.2",
  "sentencepiece==0.2.2",
  "protobuf==7.36.2",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
  "numpy==2.5.3",
  "pillow==11.3.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kandinsky_controlnet_depth_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
